services:
  # --- Infrastructure ---

  postgres:
    image: postgres:16-alpine
    container_name: loretta-postgres
    environment:
      POSTGRES_USER: loretta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-secrets.sh}
      POSTGRES_DB: loretta_auth
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loretta"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: loretta-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: loretta-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run scripts/dev-secrets.sh}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Services ---

  discovery-service:
    build:
      context: ./server
      dockerfile: discovery-service/Dockerfile
    container_name: loretta-discovery
    ports:
      - "127.0.0.1:${EUREKA_HOST_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://eureka:eureka@localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./server
      dockerfile: api-gateway/Dockerfile
    container_name: loretta-gateway
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      EUREKA_URL: http://eureka:eureka@discovery-service:8761/eureka/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?run scripts/dev-secrets.sh}
      AI_SERVICE_URL: http://ai-service:8090
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  auth-service:
    build:
      context: ./server
      dockerfile: auth-service/Dockerfile
    container_name: loretta-auth
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loretta_auth
      DB_USERNAME: loretta
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-secrets.sh}
      REDIS_HOST: redis
      EUREKA_URL: http://eureka:eureka@discovery-service:8761/eureka/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?run scripts/dev-secrets.sh}
      AUTH_BOOTSTRAP_ENABLED: "true"
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lorettabank.co.za}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run scripts/dev-secrets.sh}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

  customer-service:
    build:
      context: ./server
      dockerfile: customer-service/Dockerfile
    container_name: loretta-customer
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loretta_customer
      DB_USERNAME: loretta
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-secrets.sh}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka:eureka@discovery-service:8761/eureka/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  account-service:
    build:
      context: ./server
      dockerfile: account-service/Dockerfile
    container_name: loretta-account
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loretta_account
      DB_USERNAME: loretta
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-secrets.sh}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka:eureka@discovery-service:8761/eureka/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  transaction-service:
    build:
      context: ./server
      dockerfile: transaction-service/Dockerfile
    container_name: loretta-transaction
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loretta_transaction
      DB_USERNAME: loretta
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-secrets.sh}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka:eureka@discovery-service:8761/eureka/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCOUNT_SERVICE_URL: http://account-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      account-service:
        condition: service_started

  notification-service:
    build:
      context: ./server
      dockerfile: notification-service/Dockerfile
    container_name: loretta-notification
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loretta_notification
      DB_USERNAME: loretta
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-secrets.sh}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka:eureka@discovery-service:8761/eureka/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  audit-service:
    build:
      context: ./server
      dockerfile: audit-service/Dockerfile
    container_name: loretta-audit
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loretta_audit
      DB_USERNAME: loretta
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-secrets.sh}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka:eureka@discovery-service:8761/eureka/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  reporting-service:
    build:
      context: ./server
      dockerfile: reporting-service/Dockerfile
    container_name: loretta-reporting
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loretta_reporting
      DB_USERNAME: loretta
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-secrets.sh}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka:eureka@discovery-service:8761/eureka/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCOUNT_SERVICE_URL: http://account-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8084
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      customer-service:
        condition: service_started

  ai-service:
    build:
      context: ./ai
    container_name: loretta-ai
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    environment:
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run scripts/dev-secrets.sh}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      ACCOUNT_SERVICE_URL: http://account-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8084
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./client
    container_name: loretta-frontend
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Server-side only: the browser never calls the gateway directly.
      API_URL: http://api-gateway:8080
      SESSION_SECRET: ${SESSION_SECRET:?run scripts/dev-secrets.sh}
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  postgres_data:
