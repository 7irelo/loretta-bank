apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-service.fullname" . }}
  labels:
    {{- include "ai-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-service.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: ai-service
          image: {{ include "ai-service.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: loretta-secrets
                  key: INTERNAL_JWT_SECRET
            {{- range $key := list "ANTHROPIC_API_KEY" "OPENAI_API_KEY" "DEEPGRAM_API_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: loretta-secrets
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- range $key := list "CUSTOMER_SERVICE_URL" "ACCOUNT_SERVICE_URL" "TRANSACTION_SERVICE_URL" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: loretta-config
                  key: {{ $key }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
