{{- if not .Values.global.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: loretta-secrets
  labels:
    app.kubernetes.io/part-of: loretta-bank
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.global.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ required "global.postgres.password is required" .Values.global.postgres.password | quote }}
  POSTGRES_DB: loretta_auth
  DB_USERNAME: {{ .Values.global.postgres.username | quote }}
  DB_PASSWORD: {{ .Values.global.postgres.password | quote }}
  JWT_SECRET: {{ required "global.jwt.secret is required" .Values.global.jwt.secret | quote }}
  INTERNAL_JWT_SECRET: {{ required "global.internalJwt.secret is required" .Values.global.internalJwt.secret | quote }}
  REDIS_PASSWORD: {{ .Values.global.redis.password | quote }}
  ANTHROPIC_API_KEY: {{ .Values.global.ai.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.global.ai.openaiApiKey | quote }}
  DEEPGRAM_API_KEY: {{ .Values.global.ai.deepgramApiKey | quote }}
  AUTH_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.global.auth.bootstrapAdminPassword | quote }}
{{- end }}
