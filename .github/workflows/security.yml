name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Vulnerable dependencies and misconfigurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        run: >
          docker run --rm -v "$PWD":/repo -w /repo aquasec/trivy:0.57.1 fs
          --scanners vuln,misconfig,secret --severity CRITICAL,HIGH --ignore-unfixed
          --ignorefile .trivyignore.yaml --skip-dirs ai/.venv --skip-dirs client/node_modules
          --exit-code 1 .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build Java
        if: matrix.language == 'java-kotlin'
        working-directory: server
        run: mvn -B -q -DskipTests -Dcheckstyle.skip compile
      - uses: github/codeql-action/analyze@v3
